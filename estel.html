<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Text</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 1rem;
      box-sizing: border-box;
    }

    p {
      margin: 0;
      font-size: 1.5rem;
    }
  </style>
</head>
<body>
  <p>ns q hacer aqui pero bueno</p>
</body>
</html>
